<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在地好物購物車｜桃園偏鄉輕旅行</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="experience-flow.css"><link rel="stylesheet" href="nav-unified.css"><link rel="stylesheet" href="goods-flow.css"></head><body class="goods-page">
<header class="nav global-nav"><div class="navin g-nav-inner"><a class="brand g-brand" href="index.html"><img src="../imgs/logo.png" alt="桃園偏鄉輕旅行"></a><nav class="links"><a href="AI智慧推薦系統.html">AI 智慧推薦系統</a><a href="定位打卡領好康.html">定位打卡</a><a href="數位集章趣.html">數位集章</a><a href="體驗活動線上報名.html">體驗活動</a><a class="active" href="在地好物直送.html">在地好物</a><a href="場域介紹.html">場域介紹</a><a href="最新消息.html">最新消息</a></nav><div class="actions g-actions"><button class="ghost g-login">登入</button><button class="primary g-signup">註冊</button></div></div></header><div class="spacer"></div>
<main class="max-w-6xl mx-auto px-4 md:px-6 pb-20"><div class="flex flex-wrap items-center justify-between gap-4 py-7"><div><p class="text-xs tracking-[.2em] text-emerald-200 font-black">LOCAL GOODS CART</p><h1 class="text-3xl md:text-4xl font-black mt-2">購物車</h1></div><div class="flex items-center gap-3"><span class="flow-step active"><i>1</i><span class="flow-label">確認訂單</span></span><span class="text-white/25">—</span><span class="flow-step"><i>2</i><span class="flow-label">填寫資料</span></span><span class="text-white/25">—</span><span class="flow-step"><i>3</i><span class="flow-label">付款</span></span><span class="text-white/25">—</span><span class="flow-step"><i>4</i><span class="flow-label">完成訂單</span></span></div></div><div class="grid lg:grid-cols-[1fr_350px] gap-x-7 gap-y-4 items-start"><section class="contents"><div class="flex items-center justify-between gap-4 lg:col-start-1 lg:row-start-1"><label class="text-sm font-bold"><input id="selectAll" type="checkbox" checked class="goods-check mr-2" onchange="toggleAll(this.checked)">全選</label><div class="flex items-center gap-4"><span id="cartItemCount" class="text-sm text-white/45"></span><a href="在地好物直送.html" class="text-sm text-emerald-200 font-black">繼續選購好物</a></div></div><div id="goodsCartList" class="space-y-4 lg:col-start-1 lg:row-start-2"></div></section><aside class="goods-glass p-6 sticky top-28 lg:col-start-2 lg:row-start-2"><h2 class="text-xl font-black">訂單摘要</h2><div class="mt-5"><div class="goods-summary-line"><span>已選商品</span><b id="selectedCount">0 項</b></div><div class="goods-summary-line"><span>商品數量</span><b id="quantityTotal">0 件</b></div><div class="goods-summary-line total"><span>總計</span><strong id="goodsTotal" class="text-emerald-200">NT$ 0</strong></div></div><button id="goodsCheckoutButton" type="button" onclick="checkoutGoods()" class="goods-primary w-full py-4 mt-6">前往結帳</button><p class="text-center text-[11px] text-white/40 mt-4">好物購物車與體驗課程購物車分開計算</p></aside></div></main>
<div id="goodsCheckoutModal" class="goods-modal"><div class="goods-modal-card goods-glass"><button type="button" onclick="closeGoodsModal()" class="float-right text-2xl text-white/60">×</button><div class="text-4xl mt-3">🛍️</div><h2 id="goodsModalTitle" class="text-2xl font-black mt-5">確認好物訂單</h2><p id="goodsModalText" class="text-sm text-white/60 leading-7 mt-3"></p><div id="goodsModalActions" class="grid grid-cols-2 gap-3 mt-7"><button type="button" onclick="closeGoodsModal()" class="goods-ghost py-3">取消</button><button type="button" onclick="completeGoodsOrder()" class="goods-primary py-3">確認送出</button></div></div></div><div id="goodsToast" class="goods-toast"></div>
<script src="goods-store.js"></script><script>
let selected=new Set(),checkoutSelection=[],selectionInitialized=false;
function money(n){return"NT$ "+Number(n||0).toLocaleString()}
function read(){return GoodsStore.readCart()}
function render(){const cart=read();if(!selectionInitialized){cart.forEach(item=>selected.add(item.id));selectionInitialized=true;}document.getElementById("cartItemCount").textContent=cart.length+" 項商品";const box=document.getElementById("goodsCartList");if(!cart.length){box.innerHTML='<div class="goods-glass goods-empty"><div class="text-5xl">🧺</div><h2 class="text-xl font-black mt-5">好物購物車目前是空的</h2><p class="text-white/50 mt-2">挑選一份桃園在地好物帶回家吧！</p><a href="在地好物直送.html" class="goods-primary inline-block px-8 py-3 mt-6">探索在地好物</a></div>';document.getElementById("selectAll").checked=false;selected.clear();selectionInitialized=false;updateSummary(cart);return}box.innerHTML=cart.map(item=>'<article class="goods-glass goods-cart-row"><input class="goods-check" type="checkbox" '+(selected.has(item.id)?"checked":"")+' onchange="toggleItem('+item.id+',this.checked)"><img src="'+item.img+'" alt="" onerror="this.onerror=null;this.src=\'../imgs/旅行餐具組.webp\'"><div><h3><a href="在地好物詳情.html?id='+item.id+'">'+item.name+'</a></h3><p>'+item.unit+'</p><strong>'+money(item.price*item.quantity)+'</strong></div><div class="goods-stepper"><button type="button" onclick="changeItem('+item.id+',-1)">−</button><span>'+item.quantity+'</span><button type="button" onclick="changeItem('+item.id+',1)">＋</button></div><button class="goods-remove" type="button" onclick="removeItem('+item.id+')" aria-label="刪除">×</button></article>').join("");syncAll(cart);updateSummary(cart)}
function toggleItem(id,on){on?selected.add(id):selected.delete(id);syncAll(read());updateSummary(read())}
function toggleAll(on){selected.clear();if(on)read().forEach(item=>selected.add(item.id));render()}
function syncAll(cart){document.getElementById("selectAll").checked=cart.length>0&&cart.every(item=>selected.has(item.id))}
function updateSummary(cart){const chosen=cart.filter(item=>selected.has(item.id)),quantity=chosen.reduce((sum,item)=>sum+item.quantity,0),total=GoodsStore.total(chosen);document.getElementById("selectedCount").textContent=chosen.length+" 項";document.getElementById("quantityTotal").textContent=quantity+" 件";document.getElementById("goodsTotal").textContent=money(total);const button=document.getElementById("goodsCheckoutButton");button.disabled=!chosen.length;button.style.opacity=chosen.length?1:.45}
function changeItem(id,delta){GoodsStore.update(id,delta);if(!read().some(item=>item.id===id))selected.delete(id);render()}
function removeItem(id){GoodsStore.remove(id);selected.delete(id);render()}
function openGoodsModal(){document.getElementById("goodsCheckoutModal").classList.add("open")}
function closeGoodsModal(){document.getElementById("goodsCheckoutModal").classList.remove("open")}
function checkoutGoods(){checkoutSelection=read().filter(item=>selected.has(item.id));if(!checkoutSelection.length)return;if(!localStorage.getItem("sbir_current_user")){sessionStorage.setItem("goodsPendingCheckoutItems",JSON.stringify(checkoutSelection));sessionStorage.setItem("sbir_auth_return_to","好物購物車.html?resumeCheckout=1");document.getElementById("goodsModalTitle").textContent="請先登入";document.getElementById("goodsModalText").textContent="登入後會保留目前勾選的商品，讓你繼續完成結帳。";document.getElementById("goodsModalActions").innerHTML='<button type="button" onclick="closeGoodsModal()" class="goods-ghost py-3">稍後再說</button><button type="button" onclick="location.href=\'login.html#login\'" class="goods-primary py-3">立即登入</button>';openGoodsModal();return}sessionStorage.setItem("goodsCheckoutItems",JSON.stringify(checkoutSelection));location.href="在地好物結帳.html"}
function resumeGoodsCheckout(){if(!location.search.includes("resumeCheckout=1")||!localStorage.getItem("sbir_current_user"))return;try{const pending=JSON.parse(sessionStorage.getItem("goodsPendingCheckoutItems")||"[]");if(pending.length){sessionStorage.setItem("goodsCheckoutItems",JSON.stringify(pending));sessionStorage.removeItem("goodsPendingCheckoutItems");location.replace("在地好物結帳.html")}}catch{sessionStorage.removeItem("goodsPendingCheckoutItems")}}
document.addEventListener("DOMContentLoaded",()=>{render();resumeGoodsCheckout()});window.addEventListener("goods-cart-change",render);
</script><script src="site-auth.js"></script></body></html>
