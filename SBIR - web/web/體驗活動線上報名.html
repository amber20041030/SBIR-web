    <script>
        let currentIdx = 0;
        function moveSlide(dir) { const c = document.getElementById('carousel'); currentIdx = (currentIdx + dir + 3) % 3; c.style.transform = `translateX(-${currentIdx * 100}%)`; }
        setInterval(() => moveSlide(1), 3500);

        const courses = [

            { id: 4, title: "城市綠手指｜香草植栽組合與農事體驗", category: "農事體驗", city: "桃園區", date: "2026/08/10", price: 620, rating: 4.7, reviewCount: 84, badge: "療癒推薦", img: "https://images.unsplash.com/photo-1485955900006-10f4d324d411?w=800&q=80" }
        ];

        let currentSort = 'dateDesc';
        function toggleDropdown(menuId) { document.getElementById(menuId).classList.toggle('hidden'); }
        function selectSort(val, text, labelId, menuId) { 
            currentSort = val; 
            document.getElementById('selectedSortDesktop').innerText = text;
            if(document.getElementById('selectedSortMobile')) document.getElementById('selectedSortMobile').innerText = text;
            document.getElementById(menuId).classList.add('hidden'); 
            filterAndRender(); 
        }
        
        function renderFilters() {
            const taoyuanDistricts = ['全部區域', '桃園區', '中壢區', '平鎮區', '八德區', '楊梅區', '蘆竹區', '大溪區', '龜山區', '龍潭區', '大園區', '觀音區', '新屋區', '復興區'];
            const content = `<div><h4 class="text-sm font-bold text-brand-green mb-3">體驗類型</h4><div class="space-y-2">${['農事體驗', '手作工藝', '採果體驗'].map(cat => `<label class="flex items-center gap-2 text-sm text-white/80 cursor-pointer"><input type="checkbox" value="${cat}" data-filter-kind="category" class="accent-brand-green filter-checkbox" onchange="filterAndRender()"> ${cat}</label>`).join('')}</div></div><div class="mt-6"><h4 class="text-sm font-bold text-brand-green mb-3">桃園區域</h4><div class="space-y-2">${taoyuanDistricts.map(city => `<label class="flex items-center gap-2 text-xs text-white/80 cursor-pointer"><input type="checkbox" value="${city}" data-filter-kind="district" class="accent-brand-green filter-checkbox" onchange="filterAndRender()"> ${city}</label>`).join('')}</div></div>`;
            document.getElementById('filterContent').innerHTML = content;
            document.getElementById('mobileFilterContent').innerHTML = content;
        }

        function filterAndRender() {
            const categories = [...new Set(Array.from(document.querySelectorAll('[data-filter-kind="category"]:checked')).map(el => el.value))];
            const districts = [...new Set(Array.from(document.querySelectorAll('[data-filter-kind="district"]:checked')).map(el => el.value))];
            const showAllDistricts = districts.length === 0 || districts.includes('全部區域');
            let filtered = courses.filter(c =>
                (categories.length === 0 || categories.includes(c.category)) &&
                (showAllDistricts || districts.includes(c.city))
            );
            
            if (currentSort === 'dateDesc') filtered.sort((a,b) => new Date(b.date) - new Date(a.date));
            else if (currentSort === 'popular') filtered.sort((a,b) => b.reviewCount - a.reviewCount);
            else if (currentSort === 'rating') filtered.sort((a,b) => b.rating - a.rating);
            else if (currentSort === 'priceAsc') filtered.sort((a,b) => a.price - b.price);
            else if (currentSort === 'priceDesc') filtered.sort((a,b) => b.price - a.price);

            document.getElementById('coursesGrid').innerHTML = filtered.map(c => `
                <div class="apple-glass-card overflow-hidden group p-2 cursor-pointer" role="link" tabindex="0" aria-label="查看 ${c.title} 詳情" onclick="openCourseDetail(${c.id})" onkeydown="if(event.key === 'Enter' || event.key === ' ') openCourseDetail(${c.id})">
                    <div class="relative aspect-[4/3] rounded-2xl overflow-hidden mb-3">
                        <img src="${c.img}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" onerror="this.src='https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=800&q=80'">
                        <div class="absolute top-3 left-3 bg-black/60 px-3 py-1 rounded-full text-[10px] text-brand-green border border-white/10">${c.badge}</div>
                    </div>
                    <div class="p-2">
                        <p class="text-[10px] font-bold text-brand-green">${c.category}・${c.city}</p>
                        <h3 class="font-bold text-sm text-white my-1">${c.title}</h3>
                        <div class="flex items-center gap-1 mb-2">
                             <span class="text-xs text-amber-400 font-bold">⭐ ${c.rating}</span>
                             <span class="text-[10px] text-white/50">(${c.reviewCount}則評價)</span>
                        </div>
                        <p class="text-[10px] text-white/50 mb-3">📅 梯次：${c.date}</p>
                        <div class="flex justify-between items-center gap-3 pt-3 border-t border-white/10"><span class="text-lg font-black text-brand-green">$${c.price}</span><div class="flex items-center gap-2"><button type="button" class="favorite-btn" data-favorite-id="${c.id}" aria-label="收藏 ${c.title}" aria-pressed="false" onclick="event.stopPropagation(); toggleFavorite(${c.id}, this)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z"/></svg></button><button type="button" onclick="event.stopPropagation(); openCourseDetail(${c.id})" class="px-4 py-1.5 apple-glass-btn-green text-[11px]">查看詳情</button></div></div>
                    </div>
                </div>
            `).join('');
            applyFavoriteStates();
        }
        const experienceFavoritesKey = 'experienceFavorites';
        function getExperienceFavorites() {
            try { return JSON.parse(localStorage.getItem(experienceFavoritesKey) || '[]').map(Number); }
            catch { return []; }
        }
        function applyFavoriteStates() {
            const favorites = new Set(getExperienceFavorites());
            document.querySelectorAll('[data-favorite-id]').forEach(button => {
                const isFavorite = favorites.has(Number(button.dataset.favoriteId));
                button.classList.toggle('is-favorite', isFavorite);
                button.setAttribute('aria-pressed', String(isFavorite));
            });
        }
        function toggleFavorite(id, button) {
            const favorites = new Set(getExperienceFavorites());
            favorites.has(id) ? favorites.delete(id) : favorites.add(id);
            localStorage.setItem(experienceFavoritesKey, JSON.stringify([...favorites]));
            applyFavoriteStates();
            button.animate([{ transform: 'scale(.86)' }, { transform: 'scale(1.14)' }, { transform: 'scale(1)' }], { duration: 260, easing: 'ease-out' });
        }        function openCourseDetail(id) { location.href = `體驗活動詳情.html?id=${id}`; }
        function filterByCategory(cat) { document.querySelectorAll('.filter-checkbox').forEach(el => el.checked = (el.value === cat)); filterAndRender(); document.getElementById('allCourses').scrollIntoView({ behavior: 'smooth' }); }
        function toggleMobileFilter(show) { document.getElementById('mobileFilterModal').classList.toggle('hidden', !show); }
        function resetFilters() { document.querySelectorAll('.filter-checkbox').forEach(el => el.checked = false); filterAndRender(); }
        document.addEventListener('DOMContentLoaded', () => { renderFilters(); filterAndRender(); });
    </script>
<script>
(()=>{const nav=document.getElementById("globalNav"),button=document.getElementById("globalMenuBtn"),menu=document.getElementById("globalMobileMenu");if(!nav||!button||!menu)return;const close=()=>{menu.classList.remove("open");button.setAttribute("aria-expanded","false");button.setAttribute("aria-label","開啟選單")};button.addEventListener("click",()=>{const open=button.getAttribute("aria-expanded")==="true";menu.classList.toggle("open",!open);button.setAttribute("aria-expanded",String(!open));button.setAttribute("aria-label",open?"開啟選單":"關閉選單")});menu.querySelectorAll("a").forEach(link=>link.addEventListener("click",close));window.addEventListener("resize",()=>{if(innerWidth>920)close()});window.addEventListener("scroll",()=>nav.classList.toggle("scrolled",scrollY>24),{passive:true})})();
</script><script src="experience-cart.js"></script><script src="site-auth.js"></script></body>
</html>
