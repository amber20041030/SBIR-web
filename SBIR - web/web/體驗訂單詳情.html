<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>體驗詳細訂單 - 桃園偏鄉輕旅行</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="experience-flow.css"><link rel="stylesheet" href="nav-unified.css"><style>
.order-status{display:inline-flex;padding:8px 13px;border:1px solid #b8d6c650;border-radius:999px;background:#b8d6c618;color:#d9ebe1;font-size:12px;font-weight:900}.detail-row{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid #ffffff14}.detail-row:last-child{border-bottom:0}.detail-row span{color:#ffffff78;font-size:13px}.detail-row b{text-align:right;font-size:13px}.order-detail-item{display:grid;grid-template-columns:90px 1fr auto;gap:16px;align-items:center;padding:17px 0;border-bottom:1px solid #ffffff14}.order-detail-item:last-child{border-bottom:0}.order-detail-item img{width:90px;height:76px;border-radius:15px;object-fit:cover}.order-detail-item h3{margin:0;font-size:15px}.order-detail-item p{margin:6px 0 0;color:#ffffff70;font-size:12px}.order-detail-item strong{color:#d9ebe1}.not-found{display:none;text-align:center;padding:80px 20px}.not-found.show{display:block}@media(max-width:600px){.order-detail-item{grid-template-columns:70px 1fr}.order-detail-item img{width:70px;height:62px}.order-detail-item strong{grid-column:2}.detail-row{align-items:flex-start}}
</style></head><body>

<main class="max-w-5xl mx-auto px-4 md:px-6 pb-20"><div class="py-7"><a href="member.html#orders" class="text-sm text-white/60 hover:text-white">← 返回我的訂單</a><div class="flex flex-wrap items-end justify-between gap-4 mt-5"><div><p class="text-xs tracking-[.18em] text-emerald-200 font-black">ORDER DETAILS</p><h1 class="text-3xl md:text-4xl font-black mt-2">詳細訂單</h1><p id="orderId" class="text-sm text-white/45 mt-2"></p></div><span id="orderStatus" class="order-status"></span></div></div>
<div id="detailView" class="grid lg:grid-cols-[1fr_330px] gap-7 items-start"><div class="space-y-6"><section class="glass p-6 md:p-8"><h2 class="text-xl font-black">體驗課程</h2><div id="orderItems" class="mt-4"></div></section><section class="glass p-6 md:p-8"><h2 class="text-xl font-black">聯絡資料</h2><div class="mt-4"><div class="detail-row"><span>姓名</span><b id="contactName"></b></div><div class="detail-row"><span>國家／地區</span><b id="contactCountry"></b></div><div class="detail-row"><span>手機號碼</span><b id="contactPhone"></b></div><div class="detail-row"><span>電子信箱</span><b id="contactEmail"></b></div></div></section><section class="glass p-6 md:p-8"><h2 class="text-xl font-black">發票／收據</h2><div class="mt-4"><div class="detail-row"><span>類型</span><b id="invoiceType"></b></div><div class="detail-row"><span>寄送電子郵件</span><b id="invoiceEmail"></b></div></div></section></div>
<aside class="glass p-6 sticky top-28"><h2 class="text-xl font-black">訂單摘要</h2><div class="mt-5"><div class="detail-row"><span>建立時間</span><b id="createdAt"></b></div><div class="detail-row"><span>課程數量</span><b id="itemCount"></b></div><div class="detail-row"><span>參加人次</span><b id="guestCount"></b></div><div class="summary-line total"><span>訂單總額</span><strong id="orderTotal" class="text-emerald-200"></strong></div></div><a href="體驗活動線上報名.html" class="primary block text-center py-4 mt-6">繼續探索體驗</a></aside></div>
<section id="notFound" class="not-found glass"><div class="text-5xl">📄</div><h2 class="text-2xl font-black mt-5">找不到此訂單</h2><p class="text-white/50 mt-2">訂單可能不存在，或不屬於目前登入帳號。</p><a href="member.html#orders" class="primary inline-block px-8 py-4 mt-7">返回我的訂單</a></section></main>
<script>
function money(n){return"NT$ "+Number(n||0).toLocaleString()}function value(id,text){document.getElementById(id).textContent=text||"—"}
function init(){const id=new URLSearchParams(location.search).get("id"),email=(localStorage.getItem("sbir_current_user")||"demo@example.com").toLowerCase();let orders=[];try{orders=JSON.parse(localStorage.getItem("experienceOrders")||"[]")}catch{}const order=orders.find(x=>x.id===id&&String(x.userEmail||"").toLowerCase()===email);if(!order){document.getElementById("detailView").classList.add("hidden");document.getElementById("notFound").classList.add("show");return}document.title=order.id+"｜詳細訂單｜桃園偏鄉輕旅行";value("orderId","訂單編號："+order.id);value("orderStatus",order.status||"已付款");const items=order.items||[];document.getElementById("orderItems").innerHTML=items.map(item=>'<article class="order-detail-item"><img src="'+item.image+'" alt="" onerror="this.onerror=null;this.src=&quot;../imgs/水蜜桃.png&quot;"><div><h3>'+item.title+'</h3><p>'+item.date+'・'+item.guests+' 人</p></div><strong>'+money(item.price*item.guests)+'</strong></article>').join("");const c=order.contact||{};value("contactName",(c.lastName||"")+" "+(c.firstName||""));value("contactCountry",c.country);value("contactPhone",(c.phoneRegion||"")+" "+(c.phone||""));value("contactEmail",c.email);const invoiceLabels={personal:"個人",company:"公司",donate:"捐贈"};value("invoiceType",invoiceLabels[order.invoice?.type]||"個人");value("invoiceEmail",order.invoice?.email);const created=new Date(order.createdAt);value("createdAt",Number.isNaN(created.getTime())?"":new Intl.DateTimeFormat("zh-TW",{dateStyle:"medium",timeStyle:"short"}).format(created));value("itemCount",items.length+" 項");value("guestCount",items.reduce((s,x)=>s+Number(x.guests||0),0)+" 人");value("orderTotal",money(order.total))}
document.addEventListener("DOMContentLoaded",init);
</script><script src="site-auth.js"></script></body></html>
