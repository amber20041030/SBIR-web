3:{title:"季節限定｜中壢有機溫室草莓採果樂",category:"採果體驗",city:"中壢區",date:"2026/08/12",price:480,rating:4.9,reviews:210,badge:"季節限定",img:"https://images.unsplash.com/photo-1464965911861-746a04b4bca6?auto=format&fit=crop&w=1400&q=85",summary:"在友善溫室尋找最甜的紅寶石，享受輕鬆採果時光。",description:"農友分享草莓品種、甜度辨識與照顧方式，導覽後可自由採摘並秤重帶回，適合全家參加。",address:"桃園市中壢區山東路有機溫室農場",highlights:["友善溫室採摘","草莓知識導覽","親子友善動線"],schedule:["農場報到","草莓採摘教學","自由採果","秤重包裝"]},
4:{title:"城市綠手指｜香草植栽組合與農事體驗",category:"農事體驗",city:"桃園區",date:"2026/08/10",price:620,rating:4.7,reviews:84,badge:"療癒推薦",img:"https://images.unsplash.com/photo-1485955900006-10f4d324d411?auto=format&fit=crop&w=1400&q=85",summary:"挑選喜歡的香草，組合一座屬於自己的迷你香草花園。",description:"從聞香辨識開始，認識適合台灣氣候的香草，學習介質配置、移植與修剪，自由搭配三種香草完成組盆。",address:"桃園市桃園區中山路城市農園教室",highlights:["三款香草搭配","植栽照護教學","成品帶回家"],schedule:["香草聞香導覽","盆器介質介紹","植栽組盆實作","照護說明"]}};
let c,id,count=1;const alt1="https://images.unsplash.com/photo-1464226184884-fa280b87c399?auto=format&fit=crop&w=900&q=80",alt2="https://images.unsplash.com/photo-1536657464919-892534f60d6e?auto=format&fit=crop&w=900&q=80";
function makeList(id,items,mark){document.getElementById(id).innerHTML=items.map(x=>'<li class="flex gap-3"><b class="text-emerald-200">'+mark+'</b><span>'+x+'</span></li>').join("")}
let selectedDate="";

{name:"陳先生",date:"2026/08/09",score:"5.0",text:"活動內容和介紹相符，現場環境舒服，孩子回家後還一直分享體驗過程。"},
{name:"王小姐",date:"2026/07/28",score:"4.8",text:"很適合朋友或親子一起參加，集合說明清楚，成品與照片都很值得收藏。"}
];
function renderDates(dates){selectedDate=dates[0];document.getElementById("dateMenu").innerHTML=dates.map(date=>`<button type="button" class="date-option ${date===selectedDate?'active':''}" onclick="selectDate('${date}')">${date}</button>`).join("");syncDateUI()}function syncDateUI(){document.getElementById("dateLabel").textContent=selectedDate;document.querySelectorAll(".date-option").forEach(option=>option.classList.toggle("active",option.textContent===selectedDate))}
function selectDate(date){selectedDate=date;syncDateUI();closeDateMenus()}
function toggleDateMenu(id){const menu=document.getElementById(id),willOpen=menu.classList.contains("hidden");closeDateMenus();if(willOpen){menu.classList.remove("hidden");menu.previousElementSibling.classList.add("open")}}

function change(n){count=Math.max(1,Math.min(8,count+n));update()}
function update(){document.querySelectorAll(".guests").forEach(x=>x.textContent=count);document.querySelectorAll(".total").forEach(x=>x.textContent=(c.price*count).toLocaleString())}
function currentCourseItem(){return{id:id,title:c.title,image:c.img,price:c.price,date:selectedDate,guests:count}}
function openBook(){
 const item=currentCourseItem();
 if(!localStorage.getItem("sbir_current_user")){
  sessionStorage.setItem("experiencePendingBooking",JSON.stringify(item));
  showExperienceLoginGate({message:"登入後會自動將剛才選擇的課程加入購物車。",returnTo:"體驗活動詳情.html?id="+id});
  return;
 }
 addExperienceToCart(item);location.href="購物車.html";
}
function addCurrentCourseToCart(){if(typeof addExperienceToCart!=="function")return;addExperienceToCart(currentCourseItem());openExperienceCart(true)}
function resumePendingBooking(){
 if(!localStorage.getItem("sbir_current_user"))return;
 const raw=sessionStorage.getItem("experiencePendingBooking");if(!raw)return;
 try{const item=JSON.parse(raw);sessionStorage.removeItem("experiencePendingBooking");addExperienceToCart(item);location.replace("購物車.html")}catch{sessionStorage.removeItem("experiencePendingBooking")}
}
document.addEventListener("DOMContentLoaded",()=>{init();resumePendingBooking()});document.addEventListener("click",closeDateMenus);window.addEventListener("scroll",()=>document.getElementById("backTop").classList.toggle("show",scrollY>420),{passive:true});
