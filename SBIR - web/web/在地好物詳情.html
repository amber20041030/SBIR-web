<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品詳情｜桃園偏鄉輕旅行</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="experience-flow.css"><link rel="stylesheet" href="nav-unified.css"><link rel="stylesheet" href="goods-flow.css"></head><body class="goods-page">
<header class="nav global-nav"><div class="navin g-nav-inner"><a class="brand g-brand" href="index.html"><img src="../imgs/logo.png" alt="桃園偏鄉輕旅行"></a><nav class="links"><a href="AI智慧推薦系統.html">AI 智慧推薦系統</a><a href="定位打卡領好康.html">定位打卡</a><a href="數位集章趣.html">數位集章</a><a href="體驗活動線上報名.html">體驗活動</a><a class="active" href="在地好物直送.html">在地好物</a><a href="場域介紹.html">場域介紹</a><a href="最新消息.html">最新消息</a></nav><div class="actions g-actions"><button class="ghost g-login">登入</button><button class="primary g-signup">註冊</button><a class="goods-cart-link" href="好物購物車.html">購物車 <b class="goods-cart-count">0</b></a></div></div><a class="goods-mobile-cart" href="好物購物車.html" aria-label="開啟好物購物車">🛒 <b class="goods-cart-count">0</b></a></header><div class="spacer"></div>
<main class="max-w-6xl mx-auto px-4 md:px-6 pb-20"><div class="py-5"><a href="在地好物直送.html" class="text-sm text-white/55 hover:text-white">← 返回在地好物</a></div><section class="goods-glass p-5 md:p-8"><div class="grid lg:grid-cols-2 gap-8 lg:gap-12"><div><img id="productImage" class="goods-detail-image" alt=""><div id="productHighlights" class="grid grid-cols-3 gap-3 mt-4"></div></div><div class="flex flex-col justify-center"><div class="flex flex-wrap gap-2"><span id="district" class="goods-chip"></span><span id="category" class="goods-chip"></span><span id="promo" class="goods-chip"></span></div><h1 id="productName" class="text-3xl md:text-4xl font-black mt-5"></h1><p id="productSummary" class="text-white/60 leading-8 mt-4"></p><div class="flex items-end justify-between gap-4 py-6 mt-6 border-y border-white/10"><div><small class="text-white/45">售價</small><p class="text-3xl font-black text-emerald-200 mt-1">NT$ <span id="productPrice"></span></p></div><div class="text-right"><small class="text-white/45">規格</small><p id="productUnit" class="font-bold mt-1"></p></div></div><div class="flex items-center justify-between gap-5 mt-6"><div><p class="text-sm font-black mb-2">購買數量</p><div class="goods-stepper"><button type="button" onclick="changeQuantity(-1)">−</button><span id="quantity">1</span><button type="button" onclick="changeQuantity(1)">＋</button></div></div><p class="text-sm text-white/45">庫存 <span id="stock"></span> 件</p></div><div class="grid sm:grid-cols-2 gap-3 mt-7"><button type="button" onclick="addCurrentProduct(false)" class="goods-ghost py-4">加入購物車</button><button type="button" onclick="addCurrentProduct(true)" class="goods-primary py-4">立即購買</button></div></div></div></section><section class="grid md:grid-cols-2 gap-6 mt-7"><article class="goods-glass p-6 md:p-8"><h2 class="text-xl font-black">商品資訊</h2><ul id="productDetails" class="mt-5 space-y-4 text-sm text-white/65"></ul></article><article class="goods-glass p-6 md:p-8"><h2 class="text-xl font-black">配送說明</h2><div class="mt-5 space-y-4 text-sm text-white/65 leading-7"><p>商品由桃園在地小農或合作品牌安排出貨。</p><p>一般商品預計 3～5 個工作天寄出；生鮮商品依採收狀況調整。</p><p>不同溫層商品可能分開配送，實際資訊以訂單內容為準。</p></div></article></section></main><div id="goodsToast" class="goods-toast">已加入購物車</div>
<script src="goods-store.js"></script><script>
let product,quantity=1;
function money(n){return Number(n||0).toLocaleString()}
function updateCartCount(){document.querySelectorAll(".goods-cart-count").forEach(el=>el.textContent=GoodsStore.count())}
function init(){const id=Number(new URLSearchParams(location.search).get("id"))||1;product=GoodsStore.getProduct(id)||GoodsStore.products[0];document.title=product.name+"｜在地好物｜桃園偏鄉輕旅行";document.getElementById("productImage").src=product.img;document.getElementById("productImage").onerror=()=>{document.getElementById("productImage").src="../imgs/旅行餐具組.webp"};document.getElementById("productName").textContent=product.name;document.getElementById("productSummary").textContent=product.summary;document.getElementById("productPrice").textContent=money(product.price);document.getElementById("productUnit").textContent=product.unit;document.getElementById("stock").textContent=product.stock;["district","category","promo"].forEach(id=>document.getElementById(id).textContent=product[id]);document.getElementById("productHighlights").innerHTML=product.highlights.map(item=>'<div class="goods-soft p-3 text-center text-xs font-black">'+item+'</div>').join("");document.getElementById("productDetails").innerHTML=product.details.map(item=>'<li class="flex gap-3"><b class="text-emerald-200">✓</b><span>'+item+'</span></li>').join("");updateCartCount()}
function changeQuantity(delta){quantity=Math.max(1,Math.min(product.stock,quantity+delta));document.getElementById("quantity").textContent=quantity}
function addCurrentProduct(goCart){GoodsStore.add(product.id,quantity);updateCartCount();if(goCart){location.href="好物購物車.html";return}const toast=document.getElementById("goodsToast");toast.textContent="「"+product.name+"」已加入購物車";toast.classList.add("show");clearTimeout(window.goodsToastTimer);window.goodsToastTimer=setTimeout(()=>toast.classList.remove("show"),2200)}
document.addEventListener("DOMContentLoaded",init);window.addEventListener("goods-cart-change",updateCartCount);
</script><script src="site-auth.js"></script></body></html>
